name: Deploy RasterMath build to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      asset_name:
        description: Release asset containing the local dist directory
        required: true
        type: string
      sha256:
        description: SHA-256 of the release asset
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify local build
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET_NAME" =~ ^rastermath-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}\.tar\.gz$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p download site
          gh release download pages-builds \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir download
          printf '%s  %s\n' "$EXPECTED_SHA256" "download/$ASSET_NAME" | sha256sum --check -
          tar -xzf "download/$ASSET_NAME" -C site --no-same-owner
          test -f site/index.html
          test -f site/.nojekyll
          test -f site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove deployed release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          [[ "$ASSET_NAME" =~ ^rastermath-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}\.tar\.gz$ ]]
          gh release delete-asset pages-builds "$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" --yes
